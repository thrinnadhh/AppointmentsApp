version: "3.9"

services:
  # ── Spring Boot API ──────────────────────────────────────────────────────
  api:
    image: ghcr.io/${GITHUB_REPO}/appointments-api:latest
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # Only Caddy reaches this; not exposed to internet
    environment:
      DATABASE_URL:    ${DATABASE_URL}
      JWT_SECRET:      ${JWT_SECRET}
      JWT_ISSUER:      ${JWT_ISSUER}
      REDIS_URL:       redis://redis:6379
      NOVU_API_KEY:    ${NOVU_API_KEY}
      NOVU_BASE_URL:   https://api.novu.co
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── Redis (Valkey — 100% Redis-compatible, ARM64 native) ─────────────────
  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"   # Internal only
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Caddy (reverse proxy + auto-HTTPS via Cloudflare DNS) ───────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN}

  # ── Watchtower (auto-deploy on new image push to GHCR) ──────────────────
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"

volumes:
  redis_data:
  caddy_data:
  caddy_config:
