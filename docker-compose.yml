version: "3.9"

services:
  # ── Redis (Valkey — 100% Redis-compatible, ARM64 native) ─────────────────
  redis:
    image: valkey/valkey:8.0.2-alpine
    restart: unless-stopped
    command: ["valkey-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    networks:
      - internal_network
    ports:
      - "127.0.0.1:6379:6379"   # Internal only
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  internal_network:
    driver: bridge
    labels:
      com.appointments.network: "app-internal"

volumes:
  redis_data:
