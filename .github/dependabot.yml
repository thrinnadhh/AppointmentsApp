version: 2
updates:
  # Maintain GitHub Actions dependencies pinned to commit SHAs
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "pnpm/action-setup"
        update-types: ["version-update:semver-major"]
