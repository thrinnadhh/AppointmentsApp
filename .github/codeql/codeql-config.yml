name: "Appointments Platform CodeQL Security Configuration"

# Load deep security suites (OWASP Top 10, CWE Top 25, taint tracking)
queries:
  - uses: security-extended
  - uses: security-and-quality

# Filter out build outputs, agent tooling, and test fixtures to eliminate false positives
paths-ignore:
  - '**/node_modules/**'
  - '**/.next/**'
  - '**/dist/**'
  - '**/build/**'
  - 'apps/backend/bin/**'          # Prevents duplicate scanning of tracked Kotlin compiler output
  - '.agents/**'                   # Local AI agent scripts
  - '**/__tests__/**'
  - '**/*.test.ts'
  - '**/*.spec.ts'
  - '**/*.test.tsx'
  - '**/*Test.kt'
