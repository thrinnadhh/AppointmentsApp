name: security-gate-independent

on:
  pull_request:
    branches: [main]
  push:
    branches: ['security/**']

permissions:
  contents: read

concurrency:
  group: security-gate-independent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Set by a HUMAN (repo Settings > Variables) after reviewing the gate files.
      GATE_PIN_SHA: ${{ vars.GATE_PIN_SHA }}
      # Verify this release exists and bump as needed before first run.
      GITLEAKS_VERSION: '8.21.2'
    steps:
      # TODO-FOR-HUMAN: pin third-party actions to full commit SHAs (look them up on GitHub);
      # they are tag-pinned here because SHAs cannot be verified offline.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Determine base commit
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            git fetch --no-tags origin main
            BASE="$(git merge-base origin/main HEAD)"
          fi
          echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (lockfile only)
        run: |
          if   [ -f pnpm-lock.yaml ]; then corepack enable && corepack prepare pnpm@8.15.0 --activate && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ];      then corepack enable && yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else echo "No lockfile found; refusing to install unpinned dependencies"; exit 1; fi

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gl.tgz
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o gl.sha
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" gl.sha | sed 's/ gitleaks_.*/  gl.tgz/' | sha256sum -c -
          tar -xzf gl.tgz gitleaks && sudo mv gitleaks /usr/local/bin/ && gitleaks version

      # Needed only if regression tests hit the local database.
      - name: Install Supabase CLI
        if: hashFiles('supabase/config.toml') != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        if: hashFiles('supabase/config.toml') != ''
        run: |
          supabase start
          # TODO-FOR-HUMAN: export the local URL/keys under the env var names your tests expect, e.g.
          #   eval "$(supabase status -o env)"; echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"

      - name: Run security gate
        run: bash .gsd/gate.sh

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-logs
          path: .gsd/gate-logs/
          if-no-files-found: ignore
