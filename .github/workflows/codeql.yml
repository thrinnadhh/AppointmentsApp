name: "CodeQL Advanced Security Audit"

on:
  push:
    branches: [ "main", "develop" ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.agents/**'
  pull_request:
    branches: [ "main", "develop" ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.agents/**'
  schedule:
    # Run weekly on Monday at 04:00 UTC for proactive CVE/0-day detection
    - cron: '0 4 * * 1'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── JOB 1: TypeScript / JavaScript & GitHub Actions ─────────────────────────
  analyze-web-mobile-actions:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Initialize CodeQL with Security Config
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true
