name: CI — Tirupati Appointments Platform

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Full history secret scan weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      run_stress:
        description: 'Run concurrency/stress tests (slow)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── Environment defaults shared across jobs ───────────────────────────────────
env:
  NODE_VERSION: '22'
  PNPM_VERSION: '8.15.0'
  # Supabase — populated from repo secrets; fall back to stubs for build-only jobs
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
  RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID || 'rzp_test_51MockAppPlatform' }}
  RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET || 'mock_secret_key_1234567890' }}
  RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET || 'mock_webhook_secret' }}
  TEST_MERCHANT_EMAIL: ${{ secrets.TEST_MERCHANT_EMAIL || 'svims.clinic@tirupati-appointments.com' }}
  TEST_MERCHANT_PASSWORD: ${{ secrets.TEST_MERCHANT_PASSWORD || 'SvimsClinic2026!' }}
  TEST_SALON_EMAIL: ${{ secrets.TEST_SALON_EMAIL || 'naturals.salon@tirupati-appointments.com' }}
  TEST_SALON_PASSWORD: ${{ secrets.TEST_SALON_PASSWORD || 'NaturalsSalon2026!' }}
  TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL || 'admin@appointments-tirupati.com' }}
  TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD || '' }}
  ADMIN_SECRET: ${{ secrets.ADMIN_SECRET || '' }}
  SUPERADMIN_E2E_TOKEN: ${{ secrets.SUPERADMIN_E2E_TOKEN || '' }}
  ALLOW_MOCK_PAYMENTS: 'false'
  CRON_SECRET: ${{ secrets.CRON_SECRET || 'test_cron_secret_2026' }}
  NEXT_PUBLIC_GRIEVANCE_OFFICER_NAME: ${{ secrets.NEXT_PUBLIC_GRIEVANCE_OFFICER_NAME }}
  NEXT_PUBLIC_GRIEVANCE_OFFICER_EMAIL: ${{ secrets.NEXT_PUBLIC_GRIEVANCE_OFFICER_EMAIL }}
  NEXT_PUBLIC_GRIEVANCE_OFFICER_PHONE: ${{ secrets.NEXT_PUBLIC_GRIEVANCE_OFFICER_PHONE }}
  NEXT_PUBLIC_GRIEVANCE_OFFICER_ADDRESS: ${{ secrets.NEXT_PUBLIC_GRIEVANCE_OFFICER_ADDRESS }}
  EXPO_PUBLIC_GRIEVANCE_OFFICER_NAME: ${{ secrets.EXPO_PUBLIC_GRIEVANCE_OFFICER_NAME }}
  EXPO_PUBLIC_GRIEVANCE_OFFICER_EMAIL: ${{ secrets.EXPO_PUBLIC_GRIEVANCE_OFFICER_EMAIL }}
  EXPO_PUBLIC_GRIEVANCE_OFFICER_PHONE: ${{ secrets.EXPO_PUBLIC_GRIEVANCE_OFFICER_PHONE }}
  EXPO_PUBLIC_GRIEVANCE_OFFICER_ADDRESS: ${{ secrets.EXPO_PUBLIC_GRIEVANCE_OFFICER_ADDRESS }}
  EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Dependency Audit & Security Scan
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  security-audit:
    name: 🔒 Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit for high/critical vulnerabilities
        run: pnpm audit --audit-level=high
        continue-on-error: false

      - name: Check for unpopulated DPDP legal placeholders
        run: pnpm run check:legal
        continue-on-error: false

      - name: Check for secrets in source tree (PR)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@d73edfb85d79432e3c767c407afdee59c9a34fde # v3.88.1
        with:
          path: ./
          base: ${{ github.base_ref }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: false

      - name: Check for secrets in source tree (Push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before != github.sha
        uses: trufflesecurity/trufflehog@d73edfb85d79432e3c767c407afdee59c9a34fde # v3.88.1
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified
        continue-on-error: false

      - name: Gitleaks secret scan (PR & Push)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
        continue-on-error: false

      - name: Gitleaks full-history secret scan (Scheduled & Push to main)
        if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        with:
          args: --log-opts="--all"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
        continue-on-error: false

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — Lint, Typecheck
# ─────────────────────────────────────────────────────────────────────────────
  lint-typecheck:
    name: 🧹 Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (all workspaces)
        run: pnpm lint

      - name: Typecheck (all workspaces)
        run: pnpm -r exec tsc --noEmit

      - name: Check for unpopulated DPDP legal placeholders
        run: pnpm run check:legal
        continue-on-error: false

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2B — Unit & Script Verification Suites (tests/unit & tests/scripts)
# ─────────────────────────────────────────────────────────────────────────────
  unit-and-script-tests:
    name: 🧪 Unit & Script Verification Suites
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate local PostgREST asymmetric signing key if absent
        run: node scripts/generate-signing-keys.mjs

      - name: Start local Supabase and apply migrations
        run: |
          npx --yes supabase@2.20.5 start
          npx --yes supabase@2.20.5 db reset

      - name: Provision production env templates for security audit tests
        run: |
          if [ ! -f .env.production ]; then
            printf "NODE_ENV=production\nALLOW_MOCK_PAYMENTS=false\nNEXT_PUBLIC_SUPABASE_URL=https://tirupati-appointments.supabase.co\nNEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder_production_anon_key\nSUPABASE_SERVICE_ROLE_KEY=placeholder_production_service_role_key\nRAZORPAY_KEY_ID=rzp_live_placeholder\nRAZORPAY_KEY_SECRET=placeholder_live_razorpay_secret\nRAZORPAY_WEBHOOK_SECRET=placeholder_live_webhook_secret\nADMIN_SECRET=placeholder_secure_admin_secret\nSUPERADMIN_E2E_TOKEN=placeholder_secure_superadmin_token\nCRON_SECRET=placeholder_secure_cron_secret\n" > .env.production
          fi
          if [ ! -f apps/merchant-web/.env.production ]; then
            cp .env.production apps/merchant-web/.env.production
          fi

      - name: Seed hospital and tenant test data
        run: |
          eval "$(npx --yes supabase@2.20.5 status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          node scripts/seed-hospital-test-data.mjs

      - name: Start merchant-web server and run all unit & script suites
        run: |
          eval "$(npx --yes supabase@2.20.5 status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export SUPERADMIN_E2E_TOKEN="${SUPERADMIN_E2E_TOKEN:-tirupati_e2e_secure_bypass_key_2026_x9k2}"
          export ADMIN_SECRET="${ADMIN_SECRET:-tirupati_e2e_secure_bypass_key_2026_x9k2}"
          export CRON_SECRET="${CRON_SECRET:-test_cron_secret_2026}"
          export DELETION_TOKEN_SECRET="${DELETION_TOKEN_SECRET:-d24831bb6c322697ea855e7464e8e9767191d1f4d340548e400bab603f927cfe}"
          export ALLOW_MOCK_PAYMENTS="false"

          pnpm --filter @appointments/merchant-web dev --port 3000 > /tmp/merchant-web-ci.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:3000; then
              break
            fi
            sleep 1
          done

          node --test --test-concurrency=1 tests/unit/*.mjs
          node --test --test-concurrency=1 tests/scripts/test-*.mjs
          kill $SERVER_PID || true
        continue-on-error: false

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — Build (merchant-web + customer-mobile export)
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all workspaces
        run: pnpm build

      - name: Upload merchant-web build artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: merchant-web-build
          path: apps/merchant-web/.next/
          retention-days: 3

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4 — Admin E2E Tests (auth, RBAC, MFA, audit, city control)
# ─────────────────────────────────────────────────────────────────────────────
  e2e-admin:
    name: 🛡️ Admin E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Admin E2E — Core auth & RBAC
        run: pnpm exec playwright test tests/e2e/admin-auth-guard.spec.ts --reporter=github,list,html
        env:
          CI: true

      - name: Run Admin E2E — City control & merchant funnel
        run: pnpm exec playwright test tests/e2e/admin-city-control.spec.ts --reporter=github,list,html
        env:
          CI: true

      - name: Run Admin E2E — Security phases
        run: pnpm exec playwright test tests/e2e/admin-security-phases.spec.ts --reporter=github,list,html
        env:
          CI: true

      - name: Run Admin Edge Cases
        run: pnpm exec playwright test tests/e2e/edge-admin.spec.ts --reporter=github,list,html
        env:
          CI: true

      - name: Upload Admin test report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-admin
          path: |
            playwright-report/
            test-results/
          retention-days: 14

# ─────────────────────────────────────────────────────────────────────────────
# JOB 5 — Merchant E2E Tests (tenancy isolation, onboarding, operations)
# ─────────────────────────────────────────────────────────────────────────────
  e2e-merchant:
    name: 🏪 Merchant E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Merchant E2E — Tenancy isolation
        run: pnpm exec playwright test tests/e2e/merchant-tenancy-isolation.spec.ts --reporter=github,list,html
        env:
          CI: true

      - name: Run Merchant E2E — Self onboarding
        run: pnpm exec playwright test tests/e2e/merchant-self-onboarding.spec.ts --reporter=github,list,html
        env:
          CI: true

      - name: Run Merchant E2E — Operations
        run: pnpm exec playwright test tests/e2e/merchant-operations.spec.ts --reporter=github,list,html
        env:
          CI: true

      - name: Run Merchant Edge Cases
        run: pnpm exec playwright test tests/e2e/edge-merchant.spec.ts --reporter=github,list,html
        env:
          CI: true

      - name: Upload Merchant test report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-merchant
          path: |
            playwright-report/
            test-results/
          retention-days: 14

# ─────────────────────────────────────────────────────────────────────────────
# JOB 6 — Customer E2E Tests (mobile app, booking flow, reflections)
# ─────────────────────────────────────────────────────────────────────────────
  e2e-customer:
    name: 📱 Customer E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Customer E2E — App flows
        run: pnpm exec playwright test tests/e2e/customer-app.spec.ts --project=mobile-chrome --reporter=github,list,html
        env:
          CI: true

      - name: Run Customer E2E — Reflections
        run: pnpm exec playwright test tests/e2e/customer-reflection.spec.ts --project=mobile-chrome --reporter=github,list,html
        env:
          CI: true

      - name: Run Customer Edge Cases
        run: pnpm exec playwright test tests/e2e/edge-customer.spec.ts --project=mobile-chrome --reporter=github,list,html
        env:
          CI: true

      - name: Upload Customer test report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-customer
          path: |
            playwright-report/
            test-results/
          retention-days: 14

# ─────────────────────────────────────────────────────────────────────────────
# JOB 7 — Integration E2E Tests (cross-actor, lifecycle, Admin↔Merchant↔Customer)
# ─────────────────────────────────────────────────────────────────────────────
  e2e-integration:
    name: 🔗 Integration E2E Tests
    runs-on: ubuntu-latest
    needs: [e2e-admin, e2e-merchant, e2e-customer]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Customer ↔ Merchant Integration
        run: pnpm exec playwright test tests/e2e/customer-merchant-integration.spec.ts --reporter=github,list,html
        env:
          CI: true

      - name: Run Admin ↔ Merchant Integration
        run: pnpm exec playwright test tests/e2e/admin-merchant-integration.spec.ts --reporter=github,list,html
        env:
          CI: true

      - name: Run Full Flow Audit
        run: pnpm exec playwright test tests/e2e/flow-audit.spec.ts --reporter=github,list,html
        env:
          CI: true

      - name: Run Cross-System Edge Cases
        run: pnpm exec playwright test tests/e2e/edge-integrations.spec.ts --reporter=github,list,html
        env:
          CI: true

      - name: Upload Integration test report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integration
          path: |
            playwright-report/
            test-results/
          retention-days: 14

# ─────────────────────────────────────────────────────────────────────────────
# JOB 8 — Concurrency / Stress Tests (manual trigger only)
# ─────────────────────────────────────────────────────────────────────────────
  e2e-stress:
    name: ⚡ Concurrency & Stress Tests
    runs-on: ubuntu-latest
    needs: e2e-integration
    # Only runs when manually triggered with run_stress=true
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_stress == true }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: "Run stress: 50-concurrent-hold (EC-INT-05) in isolation"
        run: >
          pnpm exec playwright test
          tests/e2e/edge-integrations.spec.ts
          --grep "EC-INT-05"
          --reporter=github,list,html
          --timeout=120000
        env:
          CI: true

      - name: "Run stress: reference code uniqueness (EC-INT-09) in isolation"
        run: >
          pnpm exec playwright test
          tests/e2e/edge-integrations.spec.ts
          --grep "EC-INT-09"
          --reporter=github,list,html
          --timeout=120000
        env:
          CI: true

      - name: Upload Stress test report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-stress
          path: |
            playwright-report/
            test-results/
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# JOB 9 — Gate: All domain jobs must pass before merge is permitted
# ─────────────────────────────────────────────────────────────────────────────
  all-checks-pass:
    name: ✅ All CI Gates Passed
    runs-on: ubuntu-latest
    needs:
      - security-audit
      - lint-typecheck
      - unit-and-script-tests
      - build
      - e2e-admin
      - e2e-merchant
      - e2e-customer
      - e2e-integration
    # Run even if optional jobs are skipped so the gate always evaluates
    if: ${{ always() }}
    steps:
      - name: Verify all required jobs succeeded
        run: |
          echo "Security audit : ${{ needs.security-audit.result }}"
          echo "Lint/Typecheck : ${{ needs.lint-typecheck.result }}"
          echo "Unit/Scripts   : ${{ needs.unit-and-script-tests.result }}"
          echo "Build          : ${{ needs.build.result }}"
          echo "Admin E2E      : ${{ needs.e2e-admin.result }}"
          echo "Merchant E2E   : ${{ needs.e2e-merchant.result }}"
          echo "Customer E2E   : ${{ needs.e2e-customer.result }}"
          echo "Integration E2E: ${{ needs.e2e-integration.result }}"

          # Fail if any required job failed or was cancelled
          if [[ "${{ needs.security-audit.result }}"         != "success" ]] ||
             [[ "${{ needs.lint-typecheck.result }}"        != "success" ]] ||
             [[ "${{ needs.unit-and-script-tests.result }}" != "success" ]] ||
             [[ "${{ needs.build.result }}"                 != "success" ]] ||
             [[ "${{ needs.e2e-admin.result }}"             != "success" ]] ||
             [[ "${{ needs.e2e-merchant.result }}"          != "success" ]] ||
             [[ "${{ needs.e2e-customer.result }}"          != "success" ]] ||
             [[ "${{ needs.e2e-integration.result }}"       != "success" ]]; then
            echo "❌ One or more required CI gates failed."
            exit 1
          fi

          echo "✅ All CI gates passed — safe to merge."
