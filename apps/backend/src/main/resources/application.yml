spring:
  application:
    name: appointments-backend

  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 50
      min-spare: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.appointments: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Application-specific config
app:
  auth:
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: ${JWT_ISSUER:https://your-project.supabase.co/auth/v1}
    jwt-audience: authenticated
  novu:
    api-key: ${NOVU_API_KEY:}
    base-url: ${NOVU_BASE_URL:https://api.novu.co}
  slot-hold:
    ttl-minutes: ${SLOT_HOLD_TTL_MINUTES:10}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_MS:30000}
