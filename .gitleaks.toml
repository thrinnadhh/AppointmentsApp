# Gitleaks Configuration for Tirupati Appointments Platform
title = "Appointments Platform Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for lockfiles, dev artifacts, local gitignored files, and test mock tokens"
paths = [
  '''^\.agents/manifest\.lock\.json$''',
  '''^scratch/''',
  '''^\.source-aware/''',
  '''^strix_runs/''',
  '''(^|/)poc_.*\.py$''',
  '''^\.expo/''',
  '''(^|/)\.expo/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.next/''',
  '''(^|/)\.next-dev/''',
  '''(^|/)\.git/''',
  '''(^|/)dist/''',
  '''(^|/)build/''',
  '''(^|/)\.env$''',
  '''(^|/)\.env\.local$''',
  '''(^|/)\.env\.production$''',
  '''(^|/)\.env\.production\.local$''',
  '''^tests/e2e/stories/story-manifest\.json$''',
  '''^tests/scripts/demo-live-logs\.mjs$''',
  '''^scripts/generate-ci-env\.mjs$''',
  '''^pnpm-lock\.yaml$''',
  '''^package-lock\.json$''',
]
stopwords = [
  "whsec_dGVzdF9ob29rX3NlY3JldF8xMjM0NTY3ODkwMTI=",
  "whsec_dGVzdF_hook_secret_1234567890",
]
regexes = [
  # Local Supabase development demo keys (documented open keys with iss: supabase-demo)
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZS1kZW1vI''',
  '''eyJhbGciOiJFUzI1NiIsImtpZCI6ImY4NjVkNGZlLWMxZDItNGY2Zi1iZDVmLWMxOGM1MzVhYjI2MiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZS1kZW1vI''',
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.e30\.placeholder''',
  # Attacker 'none' algorithm JWTs used in security exploit test cases
  '''eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0''',
  # Test placeholders and mock fixtures
  '''valid-strong-anon-key-at-least-32-chars-long-1234567890''',
  '''whsec_live_validsecret12345678901234567890''',
  '''whsec_live_valid_9876543210''',
  '''valid_test_secret_12345678901234567890''',
  '''valid_test_secret_123456''',
