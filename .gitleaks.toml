# Dedicated rule to strictly catch real Razorpay Live Keys
[[rules]]
id = "razorpay-live-key"
description = "Unencrypted live Razorpay API Key ID"
regex = '''rzp_live_[a-zA-Z0-9]{14,24}'''
keywords = ["rzp_live_"]
[rules.allowlist]
regexes = [
  '''rzp_live_placeholder''',
  '''rzp_live_your_key_id''',
  '''rzp_live_ValidKeyId12345''',
  '''rzp_live_SimulatedProductionKey''',
  '''rzp_live_ProductionKeySecret12345''',
  '''rzp_live_ClientPublicKey99999''',
  '''rzp_live_realauthkey123''',
]

# Dedicated rule to strictly catch real Razorpay Test Keys
[[rules]]
id = "razorpay-test-key"
description = "Unencrypted test Razorpay API Key ID"
regex = '''rzp_test_[a-zA-Z0-9]{14,24}'''
keywords = ["rzp_test_"]
[rules.allowlist]
regexes = [
  '''rzp_test_placeholder''',
  '''rzp_test_51MockAppPlatform''',
  '''rzp_test_ValidTestKey123''',
  '''rzp_test_FreshRefundKey''',
  '''rzp_test_RecoveryKey123''',
  '''rzp_test_TirupatiAppointmentsMock''',
  '''rzp_test_TirupatiAppointments''',
]

# Dedicated rule to catch Supabase Service Role Secret Keys
[[rules]]
id = "supabase-secret-key"
description = "Supabase secret API key"
regex = '''sb_secret_[a-zA-Z0-9_\-]{30,}'''
keywords = ["sb_secret_"]
